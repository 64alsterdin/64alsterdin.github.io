<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1F7A44">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Snooker%20Tracker%22%2C%22short_name%22%3A%22Snooker%22%2C%22start_url%22%3A%22.%2Findex.html%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23FFFFFF%22%2C%22theme_color%22%3A%22%231F7A44%22%7D">
<title>Snooker Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --felt:#1F7A44;
    --felt-dark:#145A32;
    --felt-light:#2F9457;
    --brown:#8B5E34;
    --brown-dark:#6B4423;
    --brown-light:#C9A876;
    --bg:#FFFFFF;
    --card-border:#E3D9C6;
    --ink:#1B1B1B;
    --danger:#B3261E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.display{
    font-family:'Lora',serif;
    font-weight:600;
    letter-spacing:0;
    margin:0;
  }
  .tabular{ font-variant-numeric:tabular-nums; }
  #app{ min-height:100vh; display:flex; flex-direction:column; background:var(--bg); }

  .topbar{
    background:var(--felt);
    background-image:linear-gradient(180deg, var(--felt-light) 0%, var(--felt) 55%, var(--felt-dark) 100%);
    color:#FFFFFF;
    padding:14px 12px;
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    position:sticky; top:0; z-index:20;
    border-bottom:3px solid var(--brown);
  }
  .topbar h1{ font-size:1.05rem; flex:1; }
  .icon-btn{
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.3);
    color:#FFFFFF;
    border-radius:10px;
    padding:8px 12px;
    font-size:.85rem;
    font-weight:600;
    cursor:pointer;
  }
  .icon-btn:active{ background:rgba(255,255,255,.28); }

  .content{ flex:1; padding:16px; padding-bottom:32px; max-width:720px; width:100%; margin:0 auto; background:var(--bg); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--felt); color:#FFFFFF;
    border:2px solid var(--brown); border-radius:12px; padding:14px 18px;
    font-family:'Lora',serif; font-weight:600; font-size:1rem; letter-spacing:0;
    cursor:pointer; width:100%;
    box-shadow:0 3px 0 var(--brown-dark);
  }
  .btn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--brown-dark); }
  .btn.secondary{
    background:#E9F6EE; color:var(--felt-dark);
    border:2px solid var(--brown); box-shadow:0 3px 0 var(--brown-light);
  }
  .btn.secondary:active{ box-shadow:0 1px 0 var(--brown-light); }
  .btn:disabled{ opacity:.4; cursor:default; box-shadow:none; }
  .btn.small{ padding:10px 14px; font-size:.8rem; width:auto; }
  .btn.danger{ background:var(--danger); border-color:#7a1a15; box-shadow:0 3px 0 #7a1a15; }

  .stack{ display:flex; flex-direction:column; gap:12px; }
  .row{ display:flex; gap:10px; }
  .row.wrap{ flex-wrap:wrap; }

  .card{
    background:#FFFFFF; border-radius:14px; padding:16px;
    border:1px solid var(--card-border);
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }

  input[type=text]{
    width:100%; padding:12px 14px; border-radius:10px;
    border:1.5px solid var(--card-border); font-size:1rem; font-family:'Inter',sans-serif;
    background:#fff;
  }
  input[type=text]:focus{ outline:2px solid var(--felt); border-color:var(--felt); }

  .player-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 4px; border-bottom:1px solid var(--card-border);
  }
  .player-row:last-child{ border-bottom:none; }

  .chip{
    display:inline-flex; align-items:center; padding:8px 14px; border-radius:999px;
    border:1.5px solid var(--brown); background:#fff; color:var(--ink); font-weight:600; font-size:.85rem;
    cursor:pointer;
  }
  .chip.active{ background:var(--felt); color:#FFFFFF; border-color:var(--felt); }

  .checkline{ display:flex; align-items:center; gap:10px; padding:8px 2px; }
  .checkline input{ width:20px; height:20px; }

  /* --- Scoring screen: the felt table --- */
  .table-surface{
    background:radial-gradient(120% 140% at 50% -10%, var(--felt-light) 0%, var(--felt) 45%, var(--felt-dark) 100%);
    border-radius:18px;
    padding:16px;
    border:3px solid var(--brown);
    box-shadow: inset 0 0 40px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.2);
    color:#FFFFFF;
  }
  .scorecards{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:14px; }
  .scorecard{
    flex:1 1 120px; min-width:110px;
    background:rgba(255,255,255,.08);
    border:2px solid rgba(255,255,255,.25);
    border-radius:14px; padding:10px; text-align:center; cursor:pointer;
  }
  .scorecard.active{
    background:rgba(201,168,118,.25);
    border-color:var(--brown-light);
    box-shadow:0 0 0 3px rgba(201,168,118,.3);
  }
  .scorecard .name{ font-weight:600; font-size:.85rem; opacity:.9; }
  .scorecard .score{ font-family:'Lora',serif; font-weight:700; font-size:2.1rem; line-height:1.1; }
  .scorecard .team{ font-size:.65rem; opacity:.65; text-transform:uppercase; letter-spacing:.08em; }

  .section-label{
    font-size:.75rem; text-transform:uppercase; letter-spacing:.08em;
    opacity:.85; margin:14px 0 8px;
  }

  .ball-row{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
  .ball-btn{
    width:56px; height:56px; border-radius:50%; border:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Lora',serif; font-weight:700; font-size:1rem;
    box-shadow: inset -4px -6px 10px rgba(0,0,0,.35), inset 3px 4px 6px rgba(255,255,255,.35), 0 3px 6px rgba(0,0,0,.4);
  }
  .ball-btn:active{ transform:scale(.94); }
  .ball-label{ text-align:center; font-size:.62rem; margin-top:4px; opacity:.85; text-transform:uppercase; }

  .foul-row{ display:flex; justify-content:center; gap:8px; flex-wrap:wrap; }
  .foul-btn{
    background:rgba(179,38,30,.85); color:#fff; border:none; border-radius:10px;
    padding:10px 16px; font-family:'Lora',serif; font-weight:600; font-size:.95rem; cursor:pointer;
  }
  .foul-btn:active{ background:#7a1a15; }

  .log{
    background:rgba(0,0,0,.28); border-radius:12px; padding:10px; margin-top:14px;
    max-height:180px; overflow-y:auto; font-size:.8rem;
  }
  .log-entry{ padding:4px 0; border-bottom:1px solid rgba(255,255,255,.08); }
  .log-entry:last-child{ border-bottom:none; }
  .log-time{ opacity:.55; margin-right:6px; }

  /* --- Modal --- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.55);
    display:flex; align-items:flex-end; justify-content:center; z-index:50;
  }
  .modal{
    background:#fff; border-radius:20px 20px 0 0; padding:22px 18px 26px;
    border-top:3px solid var(--brown);
    width:100%; max-width:520px; max-height:88vh; overflow-y:auto;
  }
  @media (min-width:600px){
    .modal-backdrop{ align-items:center; }
    .modal{ border-radius:18px; border-top:none; border:3px solid var(--brown); }
  }

  .stat-line{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--card-border); font-size:.9rem; }
  .stat-line:last-child{ border-bottom:none; }

  .empty{ text-align:center; padding:32px 12px; opacity:.65; font-size:.9rem; }
  .error-box{ background:#fdecea; color:var(--danger); padding:10px 14px; border-radius:10px; font-size:.85rem; }

  canvas.chart{ width:100%; height:160px; display:block; background:#fff; border:1px solid var(--card-border); border-radius:12px; }

  .config-warning{
    background:#fff3cd; border:1px solid #ffe69c; color:#664d03;
    padding:14px; border-radius:12px; font-size:.85rem; line-height:1.5;
  }
  code{ background:rgba(0,0,0,.06); padding:1px 5px; border-radius:4px; font-size:.85em; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   FIREBASE CONFIG — REQUIRED
   Paste the config object from:
   Firebase console → Project settings → General →
   "Your apps" → Android/Web app → SDK setup and configuration
   (the same Firebase project you used for the Android app / rules).
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBJtaa0D1hjvLxdfFwdLvj2_1DIA-lCfzs",
  authDomain: "snookertracker-bd764.firebaseapp.com",
  projectId: "snookertracker-bd764",
  storageBucket: "snookertracker-bd764.firebasestorage.app",
  messagingSenderId: "402261984997",
  appId: "1:402261984997:web:783863f17c6593d39db60c",
  measurementId: "G-WVC34YW6LV"
};

let db = null;
let firebaseReady = false;
try {
  if (firebaseConfig.apiKey !== "REPLACE_ME") {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    firebaseReady = true;
  }
} catch (e) {
  console.error("Firebase init failed", e);
}

/* ============================================================
   DATA MODEL (mirrors the Android app so both can share one DB)
   ============================================================ */
const BALL_COLORS = [
  { name:'RED', label:'Red', points:1, hex:'#D32F2F', text:'#fff' },
  { name:'YELLOW', label:'Yellow', points:2, hex:'#FBC02D', text:'#1B1B1B' },
  { name:'GREEN', label:'Green', points:3, hex:'#388E3C', text:'#fff' },
  { name:'BROWN', label:'Brown', points:4, hex:'#6D4C41', text:'#fff' },
  { name:'BLUE', label:'Blue', points:5, hex:'#1976D2', text:'#fff' },
  { name:'PINK', label:'Pink', points:6, hex:'#EC407A', text:'#fff' },
  { name:'BLACK', label:'Black', points:7, hex:'#212121', text:'#fff' },
];

function computeFrameState(participantIds, events){
  const scores = {}, highestBreaks = {}, foulGiven = {}, foulReceived = {};
  participantIds.forEach(id => { scores[id]=0; highestBreaks[id]=0; foulGiven[id]=0; foulReceived[id]=0; });
  let curBreakPlayer = null, curBreakVal = 0;

  events.forEach(e => {
    if (e.type === 'BALL'){
      scores[e.playerId] = (scores[e.playerId]||0) + e.points;
      curBreakVal = (curBreakPlayer === e.playerId) ? curBreakVal + e.points : e.points;
      curBreakPlayer = e.playerId;
      if (curBreakVal > (highestBreaks[e.playerId]||0)) highestBreaks[e.playerId] = curBreakVal;
    } else if (e.type === 'FOUL'){
      if (e.foulReceiverId){
        scores[e.foulReceiverId] = (scores[e.foulReceiverId]||0) + e.points;
        foulReceived[e.foulReceiverId] = (foulReceived[e.foulReceiverId]||0) + e.points;
      }
      foulGiven[e.playerId] = (foulGiven[e.playerId]||0) + e.points;
      curBreakPlayer = null; curBreakVal = 0;
    } else if (e.type === 'SWITCH_TURN'){
      curBreakPlayer = null; curBreakVal = 0;
    }
  });
  return { scores, highestBreaks, foulGiven, foulReceived };
}

/* ============================================================
   APP STATE + ROUTER
   ============================================================ */
const state = {
  screen: 'home',
  players: [],
  loadingPlayers: false,
  playersError: null,

  // match setup
  mode: 'ONE_V_ONE',
  teamA: [],
  teamB: [],

  // scoring
  participantIds: [],
  playerNames: {},
  events: [],
  currentStrikerId: null,
  currentOpponentReceiverId: null,
  showSummary: false,
  saving: false,
  saveError: null,

  // stats
  summaries: [],
  statsLoading: false,
  statsError: null,

  // player detail
  selectedPlayerId: null,
  selectedPlayerName: null,
  playerFrames: [],
  playerDetailLoading: false,

  // frame history
  frames: [],
  framesLoading: false,
  framesError: null,
  selectedFrame: null,
  confirmDeleteId: null,
  deleting: false,
};

function render(){
  const app = document.getElementById('app');
  if (!firebaseReady){
    app.innerHTML = renderConfigWarning();
    return;
  }
  switch(state.screen){
    case 'home': app.innerHTML = renderHome(); break;
    case 'roster': app.innerHTML = renderRoster(); break;
    case 'setup': app.innerHTML = renderSetup(); break;
    case 'scoring': app.innerHTML = renderScoring(); break;
    case 'stats': app.innerHTML = renderStats(); break;
    case 'playerDetail': app.innerHTML = renderPlayerDetail(); attachCharts(); break;
    case 'history': app.innerHTML = renderHistory(); break;
    case 'frameDetail': app.innerHTML = renderFrameDetail(); break;
    default: app.innerHTML = renderHome();
  }
}

function go(screen){ state.screen = screen; render(); }

/* ---------- Config warning (shown until firebaseConfig is filled in) ---------- */
function renderConfigWarning(){
  return `
    <div class="topbar"><h1>Snooker Tracker</h1></div>
    <div class="content">
      <div class="config-warning">
        <strong>Firebase isn't configured yet.</strong><br><br>
        Open this file in a text editor and replace the <code>firebaseConfig</code>
        object near the top of the &lt;script&gt; with the real config from your
        Firebase project (Project settings → General → Your apps → SDK setup and
        configuration). It's the same project you already created for the Android
        app / Firestore rules, so all your players and frames will show up here too.
      </div>
    </div>`;
}

/* ---------- Home ---------- */
function renderHome(){
  return `
    <div class="topbar"><h1>Snooker Tracker</h1></div>
    <div class="content stack">
      <button class="btn" onclick="go('setup')">▶ Start New Frame</button>
      <button class="btn secondary" onclick="loadRoster();go('roster')">Manage Player Roster</button>
      <button class="btn secondary" onclick="loadStats();go('stats')">Player Statistics</button>
      <button class="btn secondary" onclick="loadFrameHistory();go('history')">Frame History</button>
    </div>`;
}

/* ---------- Roster ---------- */
async function loadRoster(){
  state.loadingPlayers = true; state.playersError = null; render();
  try{
    const snap = await db.collection('players').orderBy('name').get();
    state.players = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  } catch(e){ state.playersError = e.message; }
  state.loadingPlayers = false; render();
}
async function addPlayer(){
  const input = document.getElementById('newPlayerName');
  const name = (input.value || '').trim();
  if (!name) return;
  try{
    await db.collection('players').add({ name, createdAt: Date.now() });
    input.value = '';
    await loadRoster();
  } catch(e){ state.playersError = e.message; render(); }
}
async function deletePlayer(id){
  try{ await db.collection('players').doc(id).delete(); await loadRoster(); }
  catch(e){ state.playersError = e.message; render(); }
}
function renderRoster(){
  return `
    <div class="topbar">
      <button class="icon-btn" onclick="go('home')">← Back</button>
      <h1>Player Roster</h1>
    </div>
    <div class="content stack">
      <div class="row">
        <input type="text" id="newPlayerName" placeholder="New player name">
        <button class="btn small" style="width:auto" onclick="addPlayer()">Add</button>
      </div>
      ${state.playersError ? `<div class="error-box">${state.playersError}</div>` : ''}
      ${state.loadingPlayers ? `<div class="empty">Loading…</div>` : ''}
      <div class="card">
        ${state.players.length === 0 && !state.loadingPlayers ? `<div class="empty">No players yet — add your first one above.</div>` : ''}
        ${state.players.map(p => `
          <div class="player-row">
            <span>${escapeHtml(p.name)}</span>
            <button class="btn small danger" onclick="deletePlayer('${p.id}')">Delete</button>
          </div>`).join('')}
      </div>
    </div>`;
}

/* ---------- Match setup ---------- */
async function ensurePlayersLoaded(){
  if (state.players.length === 0) await loadRoster();
}
function setMode(mode){ state.mode = mode; state.teamA = []; state.teamB = []; render(); }
function toggleTeam(team, id){
  const maxPer = state.mode === 'ONE_V_ONE' ? 1 : 2;
  const other = team === 'A' ? state.teamB : state.teamA;
  const list = team === 'A' ? state.teamA : state.teamB;
  if (list.includes(id)){
    list.splice(list.indexOf(id), 1);
  } else if (!other.includes(id) && list.length < maxPer){
    list.push(id);
  }
  render();
}
function startFrame(){
  const maxPer = state.mode === 'ONE_V_ONE' ? 1 : 2;
  if (state.teamA.length !== maxPer || state.teamB.length !== maxPer) return;
  state.participantIds = [...state.teamA, ...state.teamB];
  state.playerNames = {};
  state.players.forEach(p => { if (state.participantIds.includes(p.id)) state.playerNames[p.id] = p.name; });
  state.events = [];
  state.currentStrikerId = state.teamA[0];
  state.currentOpponentReceiverId = state.teamB[0];
  state.showSummary = false;
  state.saveError = null;
  go('scoring');
}
function renderSetup(){
  if (state.players.length === 0 && !state.loadingPlayers) ensurePlayersLoaded();
  const maxPer = state.mode === 'ONE_V_ONE' ? 1 : 2;
  const teamCol = (team, ids) => `
    <div style="flex:1">
      <div class="section-label" style="color:var(--ink)">Team ${team}</div>
      ${state.players.map(p => `
        <label class="checkline">
          <input type="checkbox" ${ids.includes(p.id)?'checked':''}
            onchange="toggleTeam('${team}','${p.id}')">
          <span>${escapeHtml(p.name)}</span>
        </label>`).join('')}
    </div>`;
  const ready = state.teamA.length === maxPer && state.teamB.length === maxPer;
  return `
    <div class="topbar">
      <button class="icon-btn" onclick="go('home')">← Back</button>
      <h1>New Frame</h1>
    </div>
    <div class="content stack">
      <div class="row">
        <span class="chip ${state.mode==='ONE_V_ONE'?'active':''}" onclick="setMode('ONE_V_ONE')">1 vs 1</span>
        <span class="chip ${state.mode==='TWO_V_TWO'?'active':''}" onclick="setMode('TWO_V_TWO')">2 vs 2</span>
      </div>
      ${state.players.length === 0 ? `<div class="empty">Add players to your roster first.</div>` : ''}
      <div class="row card">
        ${teamCol('A', state.teamA)}
        ${teamCol('B', state.teamB)}
      </div>
      <button class="btn" ${ready?'':'disabled'} onclick="startFrame()">
        ${state.mode==='ONE_V_ONE' ? 'Start 1v1 Frame' : 'Start 2v2 Frame'}
      </button>
    </div>`;
}

/* ---------- Scoring ---------- */
function teamOf(id){ return state.teamA.includes(id) ? 'A' : 'B'; }
function opposingTeam(id){ return state.teamA.includes(id) ? state.teamB : state.teamA; }

function selectStriker(id){
  if (id === state.currentStrikerId) return;
  state.currentStrikerId = id;
  const opposing = opposingTeam(id);
  if (!opposing.includes(state.currentOpponentReceiverId)) state.currentOpponentReceiverId = opposing[0];
  state.events.push({ type:'SWITCH_TURN', playerId:id, playerName: state.playerNames[id]||'', timestamp: Date.now() });
  render();
}
function selectReceiver(id){ state.currentOpponentReceiverId = id; render(); }
function potBall(ballName){
  const ball = BALL_COLORS.find(b => b.name === ballName);
  state.events.push({
    type:'BALL', playerId: state.currentStrikerId, playerName: state.playerNames[state.currentStrikerId]||'',
    ball: ball.name, points: ball.points, timestamp: Date.now()
  });
  render();
}
function recordFoul(value){
  const receiver = state.currentOpponentReceiverId;
  state.events.push({
    type:'FOUL', playerId: state.currentStrikerId, playerName: state.playerNames[state.currentStrikerId]||'',
    points: value, foulReceiverId: receiver, foulReceiverName: state.playerNames[receiver]||'', timestamp: Date.now()
  });
  render();
}
function undoLast(){ if (state.events.length) state.events.pop(); render(); }
function requestFinish(){ state.showSummary = true; render(); }
function dismissSummary(){ state.showSummary = false; render(); }

async function confirmSaveFrame(){
  state.saving = true; state.saveError = null; render();
  try{
    const fs = computeFrameState(state.participantIds, state.events);
    const teamAScore = state.teamA.reduce((s,id)=>s+(fs.scores[id]||0),0);
    const teamBScore = state.teamB.reduce((s,id)=>s+(fs.scores[id]||0),0);
    const winnerTeam = teamAScore > teamBScore ? 'A' : (teamBScore > teamAScore ? 'B' : '');
    const winnerPlayerIds = winnerTeam === 'A' ? state.teamA : (winnerTeam === 'B' ? state.teamB : []);
    const frame = {
      matchId: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())),
      mode: state.mode,
      playerIds: state.participantIds,
      playerNames: state.playerNames,
      teamA: state.teamA,
      teamB: state.teamB,
      events: state.events,
      finalScores: fs.scores,
      teamScores: { A: teamAScore, B: teamBScore },
      highestBreaks: fs.highestBreaks,
      foulPointsGiven: fs.foulGiven,
      foulPointsReceived: fs.foulReceived,
      winnerTeam, winnerPlayerIds,
      createdAt: Date.now()
    };
    await db.collection('frames').add(frame);
    state.saving = false;
    go('home');
  } catch(e){
    state.saveError = e.message; state.saving = false; render();
  }
}

function renderScoring(){
  const fs = computeFrameState(state.participantIds, state.events);
  const scorecards = state.participantIds.map(id => `
    <div class="scorecard ${id===state.currentStrikerId?'active':''}" onclick="selectStriker('${id}')">
      <div class="name">${escapeHtml(state.playerNames[id]||'')}</div>
      <div class="score tabular">${fs.scores[id]||0}</div>
      <div class="team">Team ${teamOf(id)}</div>
    </div>`).join('');

  const ballButtons = BALL_COLORS.map(b => `
    <div style="text-align:center">
      <button class="ball-btn" style="background:${b.hex};color:${b.text}" onclick="potBall('${b.name}')">${b.points}</button>
      <div class="ball-label">${b.label}</div>
    </div>`).join('');

  const foulButtons = [4,5,6,7].map(v => `<button class="foul-btn" onclick="recordFoul(${v})">Foul ${v}</button>`).join('');

  const receiverChips = state.mode === 'TWO_V_TWO' ? `
    <div class="section-label">Receiving opponent (gets the foul points)</div>
    <div class="row wrap">
      ${opposingTeam(state.currentStrikerId).map(id => `
        <span class="chip ${state.currentOpponentReceiverId===id?'active':''}" onclick="selectReceiver('${id}')" style="background:${state.currentOpponentReceiverId===id?'var(--brown-light)':'#fff'};border-color:var(--brown-light);color:${state.currentOpponentReceiverId===id?'#fff':'var(--ink)'}">
          ${escapeHtml(state.playerNames[id]||'')}
        </span>`).join('')}
    </div>` : '';

  const logHtml = state.events.slice().reverse().map(e => {
    let text = '';
    if (e.type === 'BALL') text = `${e.playerName} potted ${e.ball[0]+e.ball.slice(1).toLowerCase()} (+${e.points})`;
    else if (e.type === 'FOUL') text = `${e.playerName} FOUL — ${e.foulReceiverName} +${e.points}`;
    else if (e.type === 'SWITCH_TURN') text = `▶ ${e.playerName} on strike`;
    const t = new Date(e.timestamp);
    const time = t.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    return `<div class="log-entry"><span class="log-time">${time}</span>${text}</div>`;
  }).join('') || `<div class="log-entry" style="opacity:.6">No actions yet. Tap a ball to begin.</div>`;

  return `
    <div class="topbar">
      <button class="icon-btn" onclick="go('setup')">← Back</button>
      <h1>${state.mode==='ONE_V_ONE'?'1v1 Frame':'2v2 Frame'}</h1>
      <button class="icon-btn" onclick="undoLast()">↺ Undo</button>
    </div>
    <div class="content">
      <div class="table-surface">
        <div class="scorecards">${scorecards}</div>

        <div class="section-label">Balls potted by ${escapeHtml(state.playerNames[state.currentStrikerId]||'')}</div>
        <div class="ball-row">${ballButtons}</div>

        <div class="section-label">Foul by ${escapeHtml(state.playerNames[state.currentStrikerId]||'')} → points to ${escapeHtml(state.playerNames[state.currentOpponentReceiverId]||'')}</div>
        <div class="foul-row">${foulButtons}</div>

        ${receiverChips}

        <div class="log">${logHtml}</div>
      </div>

      <div style="margin-top:16px">
        <button class="btn" onclick="requestFinish()">Finish Frame</button>
      </div>
    </div>
    ${state.showSummary ? renderSummaryModal(fs) : ''}
  `;
}

function renderSummaryModal(fs){
  const teamAScore = state.teamA.reduce((s,id)=>s+(fs.scores[id]||0),0);
  const teamBScore = state.teamB.reduce((s,id)=>s+(fs.scores[id]||0),0);
  const winnerText = teamAScore > teamBScore ? 'Team A wins' : (teamBScore > teamAScore ? 'Team B wins' : 'Frame drawn');
  const perPlayer = state.participantIds.map(id => `
    <div class="stat-line">
      <span>${escapeHtml(state.playerNames[id]||'')}</span>
      <span class="tabular">${fs.scores[id]||0} pts · break ${fs.highestBreaks[id]||0}</span>
    </div>
    <div class="stat-line" style="font-size:.78rem;opacity:.7;border-bottom:none;margin-top:-4px">
      <span>Fouls given ${fs.foulGiven[id]||0}</span>
      <span>Fouls received ${fs.foulReceived[id]||0}</span>
    </div>
  `).join('');

  return `
    <div class="modal-backdrop" onclick="if(event.target===this && !${state.saving}) dismissSummary()">
      <div class="modal">
        <h2>Frame Summary</h2>
        <p style="font-weight:600;margin:8px 0 0">${winnerText}</p>
        <p class="tabular" style="font-size:1.1rem;margin:6px 0 16px">Team A: ${teamAScore} — Team B: ${teamBScore}</p>
        ${perPlayer}
        ${state.saveError ? `<div class="error-box" style="margin-top:12px">${state.saveError}</div>` : ''}
        <div class="row" style="margin-top:18px">
          <button class="btn secondary" ${state.saving?'disabled':''} onclick="dismissSummary()">Keep Playing</button>
          <button class="btn" ${state.saving?'disabled':''} onclick="confirmSaveFrame()">${state.saving?'Saving…':'Save to Firebase'}</button>
        </div>
      </div>
    </div>`;
}

/* ---------- Stats dashboard ---------- */
async function loadStats(){
  state.statsLoading = true; state.statsError = null; render();
  try{
    const [playersSnap, framesSnap] = await Promise.all([
      db.collection('players').orderBy('name').get(),
      db.collection('frames').orderBy('createdAt','desc').get()
    ]);
    const players = playersSnap.docs.map(d => ({ id:d.id, ...d.data() }));
    const frames = framesSnap.docs.map(d => ({ id:d.id, ...d.data() }));
    state.summaries = players.map(p => buildSummary(p, frames)).sort((a,b)=>b.highestBreak-a.highestBreak);
  } catch(e){ state.statsError = e.message; }
  state.statsLoading = false; render();
}
function buildSummary(player, frames){
  const played = frames.filter(f => (f.playerIds||[]).includes(player.id));
  const framesWon = played.filter(f => (f.winnerPlayerIds||[]).includes(player.id)).length;
  const highestBreak = Math.max(0, ...played.map(f => (f.highestBreaks||{})[player.id] || 0));
  const bestFrameScore = Math.max(0, ...played.map(f => (f.finalScores||{})[player.id] || 0));
  const foulGiven = played.reduce((s,f)=>s+((f.foulPointsGiven||{})[player.id]||0),0);
  const foulReceived = played.reduce((s,f)=>s+((f.foulPointsReceived||{})[player.id]||0),0);
  return { player, framesPlayed: played.length, framesWon, highestBreak, bestFrameScore, foulGiven, foulReceived };
}
function renderStats(){
  return `
    <div class="topbar">
      <button class="icon-btn" onclick="go('home')">← Back</button>
      <h1>Player Statistics</h1>
    </div>
    <div class="content stack">
      <button class="btn secondary" onclick="loadFrameHistory();go('history')">📜 View Frame History</button>
      ${state.statsLoading ? `<div class="empty">Loading…</div>` : ''}
      ${state.statsError ? `<div class="error-box">${state.statsError}</div>` : ''}
      ${(!state.statsLoading && state.summaries.length===0) ? `<div class="empty">No completed frames yet.</div>` : ''}
      ${state.summaries.map(s => `
        <div class="card" onclick="openPlayerDetail('${s.player.id}','${escapeHtml(s.player.name).replace(/'/g,"\\'")}')" style="cursor:pointer">
          <h3 style="text-transform:none">${escapeHtml(s.player.name)}</h3>
          <div class="stat-line"><span>Frames played</span><span>${s.framesPlayed}</span></div>
          <div class="stat-line"><span>Frames won</span><span>${s.framesWon}</span></div>
          <div class="stat-line"><span>Highest break</span><span>${s.highestBreak}</span></div>
          <div class="stat-line"><span>Best frame score</span><span>${s.bestFrameScore}</span></div>
          <div class="stat-line"><span>Foul points given / received</span><span>${s.foulGiven} / ${s.foulReceived}</span></div>
        </div>
      `).join('')}
    </div>`;
}

/* ---------- Player detail ---------- */
async function openPlayerDetail(id, name){
  state.selectedPlayerId = id; state.selectedPlayerName = name;
  state.playerDetailLoading = true; state.playerFrames = [];
  go('playerDetail');
  try{
    const snap = await db.collection('frames')
      .where('playerIds','array-contains', id)
      .orderBy('createdAt','asc').get();
    state.playerFrames = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  } catch(e){ state.statsError = e.message; }
  state.playerDetailLoading = false; render();
}
function renderPlayerDetail(){
  const id = state.selectedPlayerId;
  const frames = state.playerFrames;
  const scores = frames.map(f => (f.finalScores||{})[id] || 0);
  const breaks = frames.map(f => (f.highestBreaks||{})[id] || 0);
  const highestBreak = Math.max(0, ...breaks);
  const bestScore = Math.max(0, ...scores);
  const wins = frames.filter(f => (f.winnerPlayerIds||[]).includes(id)).length;
  const totalGiven = frames.reduce((s,f)=>s+((f.foulPointsGiven||{})[id]||0),0);
  const totalReceived = frames.reduce((s,f)=>s+((f.foulPointsReceived||{})[id]||0),0);

  const history = frames.slice().reverse().map(f => {
    const won = (f.winnerPlayerIds||[]).includes(id);
    const d = new Date(f.createdAt);
    return `<div class="stat-line">
      <span>${d.toLocaleDateString([], {day:'2-digit',month:'short'})} — Score ${(f.finalScores||{})[id]||0}${won?' (Won)':''}</span>
      <span style="opacity:.7">Break ${(f.highestBreaks||{})[id]||0}</span>
    </div>`;
  }).join('');

  return `
    <div class="topbar">
      <button class="icon-btn" onclick="go('stats')">← Back</button>
      <h1>${escapeHtml(state.selectedPlayerName)}</h1>
    </div>
    <div class="content stack">
      ${state.playerDetailLoading ? `<div class="empty">Loading…</div>` : ''}
      ${(!state.playerDetailLoading && frames.length===0) ? `<div class="empty">No saved frames for this player yet.</div>` : ''}
      ${frames.length>0 ? `
        <div class="card">
          <div class="stat-line"><span>Frames played</span><span>${frames.length}</span></div>
          <div class="stat-line"><span>Wins</span><span>${wins}</span></div>
          <div class="stat-line"><span>Highest break</span><span>${highestBreak}</span></div>
          <div class="stat-line"><span>Best frame score</span><span>${bestScore}</span></div>
          <div class="stat-line"><span>Foul points given</span><span>${totalGiven}</span></div>
          <div class="stat-line"><span>Foul points received</span><span>${totalReceived}</span></div>
        </div>
        <div class="section-label" style="color:var(--ink)">Score progression</div>
        <canvas class="chart" id="scoreChart"></canvas>
        <div class="section-label" style="color:var(--ink)">Break progression</div>
        <canvas class="chart" id="breakChart"></canvas>
        <div class="section-label" style="color:var(--ink)">Frame history</div>
        <div class="card">${history}</div>
      ` : ''}
    </div>`;
}
function attachCharts(){
  const id = state.selectedPlayerId;
  const scores = state.playerFrames.map(f => (f.finalScores||{})[id] || 0);
  const breaks = state.playerFrames.map(f => (f.highestBreaks||{})[id] || 0);
  const scoreCanvas = document.getElementById('scoreChart');
  const breakCanvas = document.getElementById('breakChart');
  if (scoreCanvas) drawLineChart(scoreCanvas, scores, '#1F7A44');
  if (breakCanvas) drawLineChart(breakCanvas, breaks, '#8B5E34');
}
function drawLineChart(canvas, values, color){
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0,0,rect.width,rect.height);
  if (values.length === 0) return;

  const padX = 14, padY = 14;
  const w = rect.width - padX*2, h = rect.height - padY*2;
  const maxV = Math.max(1, ...values), minV = Math.min(0, ...values);
  const range = Math.max(1, maxV - minV);
  const stepX = values.length > 1 ? w / (values.length-1) : 0;
  const pt = i => [padX + stepX*i, padY + h - ((values[i]-minV)/range)*h];

  ctx.strokeStyle = '#e6e0cc'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padX, padY+h); ctx.lineTo(padX+w, padY+h); ctx.stroke();

  if (values.length === 1){
    const [x,y] = pt(0);
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x,y,4,0,7); ctx.fill();
    return;
  }
  ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.beginPath();
  values.forEach((v,i)=>{ const [x,y]=pt(i); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.stroke();
  ctx.fillStyle = color;
  values.forEach((v,i)=>{ const [x,y]=pt(i); ctx.beginPath(); ctx.arc(x,y,3.5,0,7); ctx.fill(); });
}

/* ---------- Frame history (list, view, delete) ---------- */
async function loadFrameHistory(){
  state.framesLoading = true; state.framesError = null; render();
  try{
    const snap = await db.collection('frames').orderBy('createdAt','desc').get();
    state.frames = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  } catch(e){ state.framesError = e.message; }
  state.framesLoading = false; render();
}
function openFrameDetail(frameId){
  const frame = state.frames.find(f => f.id === frameId);
  if (!frame) return;
  state.selectedFrame = frame;
  go('frameDetail');
}
function requestDeleteFrame(frameId){ state.confirmDeleteId = frameId; render(); }
function cancelDeleteFrame(){ state.confirmDeleteId = null; render(); }
async function confirmDeleteFrame(){
  const id = state.confirmDeleteId;
  if (!id) return;
  state.deleting = true; render();
  try{
    await db.collection('frames').doc(id).delete();
    state.frames = state.frames.filter(f => f.id !== id);
    // keep player-statistics / player-history views in sync next time they're opened
    state.summaries = [];
    state.playerFrames = state.playerFrames.filter(f => f.id !== id);
    state.confirmDeleteId = null;
    state.deleting = false;
    if (state.screen === 'frameDetail' && state.selectedFrame && state.selectedFrame.id === id){
      state.selectedFrame = null;
      go('history');
    } else {
      render();
    }
  } catch(e){
    state.deleting = false;
    state.framesError = e.message;
    render();
  }
}
function renderHistory(){
  const rows = state.frames.map(f => {
    const d = new Date(f.createdAt);
    const dateStr = d.toLocaleDateString([], {day:'2-digit',month:'short',year:'numeric'}) + ' · ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    const teamAScore = (f.teamScores||{}).A ?? (f.teamA||[]).reduce((s,id)=>s+((f.finalScores||{})[id]||0),0);
    const teamBScore = (f.teamScores||{}).B ?? (f.teamB||[]).reduce((s,id)=>s+((f.finalScores||{})[id]||0),0);
    const names = id => escapeHtml((f.playerNames||{})[id] || id);
    const teamAName = (f.teamA||[]).map(names).join(' & ');
    const teamBName = (f.teamB||[]).map(names).join(' & ');
    const winner = f.winnerTeam === 'A' ? teamAName : (f.winnerTeam === 'B' ? teamBName : 'Draw');
    return `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <div style="cursor:pointer;flex:1" onclick="openFrameDetail('${f.id}')">
            <div style="font-size:.75rem;opacity:.6">${dateStr} · ${f.mode==='ONE_V_ONE'?'1v1':'2v2'}</div>
            <div style="font-weight:600;margin-top:2px">${teamAName} <span class="tabular">${teamAScore}</span> — <span class="tabular">${teamBScore}</span> ${teamBName}</div>
            <div style="font-size:.8rem;opacity:.7;margin-top:2px">Winner: ${winner}</div>
          </div>
          <button class="btn small danger" onclick="event.stopPropagation();requestDeleteFrame('${f.id}')">Delete</button>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="topbar">
      <button class="icon-btn" onclick="go('home')">← Back</button>
      <h1>Frame History</h1>
    </div>
    <div class="content stack">
      ${state.framesLoading ? `<div class="empty">Loading…</div>` : ''}
      ${state.framesError ? `<div class="error-box">${state.framesError}</div>` : ''}
      ${(!state.framesLoading && state.frames.length===0) ? `<div class="empty">No saved frames yet.</div>` : ''}
      ${rows}
    </div>
    ${state.confirmDeleteId ? renderDeleteConfirm() : ''}
  `;
}
function renderDeleteConfirm(){
  return `
    <div class="modal-backdrop" onclick="if(event.target===this && !${state.deleting}) cancelDeleteFrame()">
      <div class="modal">
        <h2>Delete this frame?</h2>
        <p style="margin-top:10px">This permanently removes the frame and its event log. Every player's statistics will update automatically once it's gone.</p>
        <div class="row" style="margin-top:18px">
          <button class="btn secondary" ${state.deleting?'disabled':''} onclick="cancelDeleteFrame()">Cancel</button>
          <button class="btn danger" ${state.deleting?'disabled':''} onclick="confirmDeleteFrame()">${state.deleting?'Deleting…':'Delete Frame'}</button>
        </div>
      </div>
    </div>`;
}
function renderFrameDetail(){
  const f = state.selectedFrame;
  if (!f) return `<div class="topbar"><button class="icon-btn" onclick="go('history')">← Back</button><h1>Frame</h1></div><div class="content"><div class="empty">Frame not found.</div></div>`;

  const names = id => escapeHtml((f.playerNames||{})[id] || id);
  const d = new Date(f.createdAt);
  const dateStr = d.toLocaleDateString([], {day:'2-digit',month:'short',year:'numeric'}) + ' · ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  const teamAScore = (f.teamScores||{}).A ?? 0;
  const teamBScore = (f.teamScores||{}).B ?? 0;
  const winner = f.winnerTeam === 'A' ? 'Team A' : (f.winnerTeam === 'B' ? 'Team B' : 'Draw');

  const perPlayer = (f.playerIds||[]).map(id => `
    <div class="stat-line">
      <span>${names(id)}</span>
      <span class="tabular">${(f.finalScores||{})[id]||0} pts · break ${(f.highestBreaks||{})[id]||0}</span>
    </div>
    <div class="stat-line" style="font-size:.78rem;opacity:.7;border-bottom:none;margin-top:-4px">
      <span>Fouls given ${(f.foulPointsGiven||{})[id]||0}</span>
      <span>Fouls received ${(f.foulPointsReceived||{})[id]||0}</span>
    </div>`).join('');

  const events = (f.events||[]);
  const logHtml = events.map(e => {
    let text = '';
    if (e.type === 'BALL') text = `${e.playerName} potted ${(e.ball||'').charAt(0)+(e.ball||'').slice(1).toLowerCase()} (+${e.points})`;
    else if (e.type === 'FOUL') text = `${e.playerName} FOUL — ${e.foulReceiverName} +${e.points}`;
    else if (e.type === 'SWITCH_TURN') text = `▶ ${e.playerName} on strike`;
    const t = new Date(e.timestamp);
    const time = t.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    return `<div class="log-entry" style="color:var(--ink)"><span class="log-time">${time}</span>${text}</div>`;
  }).join('') || `<div class="empty">No event log saved for this frame.</div>`;

  return `
    <div class="topbar">
      <button class="icon-btn" onclick="go('history')">← Back</button>
      <h1>Frame Detail</h1>
    </div>
    <div class="content stack">
      <div class="card">
        <div style="font-size:.8rem;opacity:.65">${dateStr} · ${f.mode==='ONE_V_ONE'?'1v1':'2v2'}</div>
        <h3 style="margin-top:6px;text-transform:none">Team A ${teamAScore} — ${teamBScore} Team B</h3>
        <div style="font-weight:600">Winner: ${winner}</div>
      </div>
      <div class="card">
        <h3 style="text-transform:none;margin-bottom:8px">Per player</h3>
        ${perPlayer}
      </div>
      <div class="section-label" style="color:var(--ink)">Full action log</div>
      <div class="card" style="max-height:260px;overflow-y:auto">${logHtml}</div>
      <button class="btn danger" onclick="requestDeleteFrame('${f.id}')">Delete This Frame</button>
    </div>
    ${state.confirmDeleteId ? renderDeleteConfirm() : ''}
  `;
}

/* ---------- utils ---------- */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- boot ---------- */
render();
</script>
</body>
</html>
