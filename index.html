<style>
  :root{
    --felt:#1F7A44;
    --felt-dark:#145A32;
    --felt-light:#2F9457;
    --brown:#8B5E34;
    --brown-dark:#6B4423;
    --brown-light:#C9A876;
    --bg:#FFFFFF;
    --card-border:#E3D9C6;
    --ink:#1B1B1B;
    --danger:#B3261E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  button,.btn,.ball-btn,.foul-btn,.icon-btn,.chip,.metric-card{ touch-action:manipulation; }
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.display{
    font-family:'Lora',serif;
    font-weight:600;
    letter-spacing:0;
    margin:0;
  }
  .tabular{ font-variant-numeric:tabular-nums; }
  #app{ min-height:100vh; display:flex; flex-direction:column; background:var(--bg); }

  /* RTL Support overrides */
  [dir="rtl"] { text-align: right; }
  [dir="rtl"] .topbar { flex-direction: row-reverse; }
  [dir="rtl"] .log-time { margin-right: 0; margin-left: 6px; }

  .topbar{
    background:var(--felt);
    background-image:linear-gradient(180deg, var(--felt-light) 0%, var(--felt) 55%, var(--felt-dark) 100%);
    color:#FFFFFF;
    padding:14px 12px;
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    position:sticky; top:0; z-index:20;
    border-bottom:3px solid var(--brown);
  }
  .topbar h1{ font-size:1.05rem; flex:1; }
  .icon-btn{
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.3);
    color:#FFFFFF;
    border-radius:10px;
    padding:8px 12px;
    font-size:.85rem;
    font-weight:600;
    cursor:pointer;
  }
  .icon-btn:active{ background:rgba(255,255,255,.28); }

  .content{ flex:1; padding:16px; padding-bottom:32px; max-width:720px; width:100%; margin:0 auto; background:var(--bg); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--felt); color:#FFFFFF;
    border:2px solid var(--brown); border-radius:12px; padding:14px 18px;
    font-family:'Lora',serif; font-weight:600; font-size:1rem; letter-spacing:0;
    cursor:pointer; width:100%;

  .btn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--brown-dark); }
  .btn.secondary{

    border:2px solid var(--brown); box-shadow:0 3px 0 var(--brown-light);

  .btn.danger{ background:var(--danger); border-color:#7a1a15; box-shadow:0 3px 0 #7a1a15; }

  .row.wrap{ flex-wrap:wrap; }

    background:#FFFFFF; border-radius:14px; padding:16px;

    box-shadow:0 1px 3px rgba(0,0,0,.06);

    background:#fff3cd; color:#664d03; border:1px solid #ffe69c;
    padding:10px 14px; border-radius:10px; font-size:.85rem; margin-top:10px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;

  .error-box{ background:#fdecea; color:var(--danger); padding:10px 14px; border-radius:10px; font-size:.85rem; }

  canvas.chart{ width:100%; height:180px; display:block; background:#fff; border:1px solid var(--card-border); border-radius:12px; }

  .config-warning{
    background:#fff3cd; border:1px solid #ffe69c; color:#664d03;
    padding:14px; border-radius:12px; font-size:.85rem; line-height:1.5;
  }
  code{ background:rgba(0,0,0,.06); padding:1px 5px; border-radius:4px; font-size:.85em; }
</style>

function computeFrameState(participantIds, events){
  const scores = {}, highestBreaks = {}, foulGiven = {}, foulReceived = {};
  participantIds.forEach(id => { scores[id]=0; highestBreaks[id]=0; foulGiven[id]=0; foulReceived[id]=0; });
  let curBreakPlayer = null, curBreakVal = 0;

  events.forEach(e => {
    if (e.type === 'BALL'){
      scores[e.playerId] = (scores[e.playerId]||0) + e.points;
      curBreakVal = (curBreakPlayer === e.playerId) ? curBreakVal + e.points : e.points;
      curBreakPlayer = e.playerId;
      if (curBreakVal > (highestBreaks[e.playerId]||0)) highestBreaks[e.playerId] = curBreakVal;
    } else if (e.type === 'FOUL'){
      if (e.foulReceiverId){
        scores[e.foulReceiverId] = (scores[e.foulReceiverId]||0) + e.points;
        foulReceived[e.foulReceiverId] = (foulReceived[e.foulReceiverId]||0) + e.points;
      }
      foulGiven[e.playerId] = (foulGiven[e.playerId]||0) + e.points;
      curBreakPlayer = null; curBreakVal = 0;
    } else if (e.type === 'SWITCH_TURN'){
      curBreakPlayer = null; curBreakVal = 0;
    }
  });
  return { scores, highestBreaks, foulGiven, foulReceived };
}

function t(key) {
  return (i18n[state.lang] && i18n[state.lang][key]) || i18n['en'][key] || key;
}

function toggleLang() {
  state.lang = state.lang === 'en' ? 'he' : 'en';
  localStorage.setItem('snooker_lang', state.lang);
  document.getElementById('html-root').setAttribute('dir', state.lang === 'he' ? 'rtl' : 'ltr');
  render();
}

function render(){
  const app = document.getElementById('app');
  document.getElementById('html-root').setAttribute('dir', state.lang === 'he' ? 'rtl' : 'ltr');
  
  if (!firebaseReady){
    app.innerHTML = renderConfigWarning();
    return;
  }
  switch(state.screen){
    case 'home': app.innerHTML = renderHome(); break;
    case 'roster': app.innerHTML = renderRoster(); break;
    case 'setup': app.innerHTML = renderSetup(); break;
    case 'scoring': app.innerHTML = renderScoring(); break;
    case 'stats': app.innerHTML = renderStats(); break;
    case 'playerDetail': app.innerHTML = renderPlayerDetail(); attachCharts(); break;
    case 'history': app.innerHTML = renderHistory(); break;
    case 'frameDetail': app.innerHTML = renderFrameDetail(); break;
    default: app.innerHTML = renderHome();
  }
}

function go(screen){
  applyScreen(screen);
  try{ history.pushState({ screen }, '', '#'+screen); } catch(e){}
}

function applyScreen(screen){
  const leavingScoring = state.screen === 'scoring' && screen !== 'scoring';
  state.screen = screen;
  render();
  if (screen === 'scoring') requestWakeLock();
  else if (leavingScoring) releaseWakeLock();
}

window.addEventListener('popstate', (event) => {
  const targetScreen = (event.state && event.state.screen) || 'home';
  if (state.screen === 'scoring' && state.events.length > 0 && targetScreen !== 'scoring'){
    const leave = confirm('Leave this frame? Any unsaved scoring progress will be lost.');
    if (!leave){
      try{ history.pushState({ screen:'scoring' }, '', '#scoring'); } catch(e){}
      return;
    }
  }
  applyScreen(targetScreen);
});
try{ history.replaceState({ screen:'home' }, '', '#home'); } catch(e){}

let wakeLockSentinel = null;
async function requestWakeLock(){
  if (!('wakeLock' in navigator)) return;
  try{
    wakeLockSentinel = await navigator.wakeLock.request('screen');
    wakeLockSentinel.addEventListener('release', () => { wakeLockSentinel = null; });
  } catch(e){}
}
async function releaseWakeLock(){
  if (wakeLockSentinel){
    try{ await wakeLockSentinel.release(); } catch(e){}
    wakeLockSentinel = null;
  }
}
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && state.screen === 'scoring' && !wakeLockSentinel){
    await requestWakeLock();
  }
});

      <button class="btn" onclick="go('setup')">${t('startNewFrame')}</button>

      <button class="btn secondary" onclick="loadStats();go('stats')">${t('playerStats')}</button>
      <button class="btn secondary" onclick="loadFrameHistory();go('history')">${t('frameHistory')}</button>
    </div>`;
}

/* Roster */
async function loadRoster(){
  state.loadingPlayers = true; state.playersError = null; render();
  try{
    const snap = await db.collection('players').orderBy('name').get();
    state.players = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  } catch(e){ state.playersError = e.message; }
  state.loadingPlayers = false; render();
}
async function addPlayer(){
  const input = document.getElementById('newPlayerName');
  const name = (input.value || '').trim();
  if (!name) return;
  try{
    await db.collection('players').add({ name, createdAt: Date.now() });
    input.value = '';
    await loadRoster();
  } catch(e){ state.playersError = e.message; render(); }
}
async function deletePlayer(id){
  try{
    await db.collection('players').doc(id).delete();
    await loadRoster();
  } catch(e){ state.playersError = e.message; render(); }
}
function renderRoster(){
  const list = state.players.map(p => `
    <div class="player-row">
      <span style="font-weight:600">${escapeHtml(p.name)}</span>
      <button class="btn small danger" onclick="deletePlayer('${p.id}')">✕</button>
    </div>`).join('');
  return `
    <div class="topbar">
      <button class="icon-btn" onclick="go('home')">${state.lang==='he'?t('backRtl'):t('back')}</button>
      <h1>${t('manageRoster')}</h1>
      ${renderLangButton()}
    </div>
    <div class="content stack">
      <div class="card stack">
        <input type="text" id="newPlayerName" placeholder="${t('playerNamePlaceholder')}">
        <button class="btn" onclick="addPlayer()">${t('addPlayer')}</button>
      </div>
      ${state.playersError ? `<div class="error-box">${escapeHtml(state.playersError)}</div>`:''}
      <div class="card">${state.loadingPlayers ? `<div class="empty">...</div>` : (list || `<div class="empty">No players yet.</div>`)}</div>
    </div>`;
}

/* Match Setup */
function teamMax(mode, team){
  if (mode === 'ONE_V_ONE') return 1;
  if (mode === 'ONE_V_TWO') return team === 'A' ? 1 : 2;
  return 2;
}
function setMode(m){
  state.mode = m; state.teamA = []; state.teamB = []; render();
}
function setMaxReds(r){
  state.maxReds = r; render();
}
function togglePlayerPick(id, team){
  const list = team === 'A' ? state.teamA : state.teamB;
  const other = team === 'A' ? state.teamB : state.teamA;
  const max = teamMax(state.mode, team);
  if (list.includes(id)){
    list.splice(list.indexOf(id), 1);
  } else if (!other.includes(id) && list.length < max){
    list.push(id);
  }
  render();
}
async function ensurePlayersLoaded(){
  if (state.players.length === 0 && !state.loadingPlayers){
    await loadRoster();
  }
}
function beginFrame(){
  state.participantIds = [...state.teamA, ...state.teamB];
  state.playerNames = {};
  state.players.forEach(p => { if (state.participantIds.includes(p.id)) state.playerNames[p.id] = p.name; });
  state.events = [];
  state.currentStrikerId = state.teamA[0];
  state.currentOpponentReceiverId = state.teamB[0];
  state.showSummary = false;
  state.summarySaved = false;
  state.saveError = null;
  state.decidedByBlackBall = false;
  state.validationWarning = null;
  go('scoring');
}
function startFrame(){
  const aMax = teamMax(state.mode, 'A'), bMax = teamMax(state.mode, 'B');
  if (state.teamA.length !== aMax || state.teamB.length !== bMax) return;
  beginFrame();
}
function renderSetup(){
  if (state.players.length === 0 && !state.loadingPlayers) ensurePlayersLoaded();
  const aMax = teamMax(state.mode, 'A'), bMax = teamMax(state.mode, 'B');
  const canStart = state.teamA.length === aMax && state.teamB.length === bMax;

  const teamCol = (team, ids, max) => `
    <div class="card stack" style="flex:1">
      <h3>${team==='A'?t('teamA'):t('teamB')} (${ids.length}/${max})</h3>
      ${state.players.map(p => {
        const pickedThis = ids.includes(p.id);
        const pickedOther = (team==='A'?state.teamB:state.teamA).includes(p.id);
        return `<span class="chip ${pickedThis?'active':''}" style="${pickedOther?'opacity:.3;pointer-events:none':''}" onclick="togglePlayerPick('${p.id}','${team}')">${escapeHtml(p.name)}</span>`;
      }).join('') || '<div class="empty">No players</div>'}
    </div>`;

  return `
    <div class="topbar">
      <button class="icon-btn" onclick="go('home')">${state.lang==='he'?t('backRtl'):t('back')}</button>
      <h1>${t('startNewFrame')}</h1>
      ${renderLangButton()}
    </div>
    <div class="content stack">
      <div class="row wrap">
        <button class="chip ${state.mode==='ONE_V_ONE'?'active':''}" onclick="setMode('ONE_V_ONE')">${t('mode1v1')}</button>
        <button class="chip ${state.mode==='ONE_V_TWO'?'active':''}" onclick="setMode('ONE_V_TWO')">${t('mode1v2')}</button>
        <button class="chip ${state.mode==='TWO_V_TWO'?'active':''}" onclick="setMode('TWO_V_TWO')">${t('mode2v2')}</button>
      </div>

      <div class="card stack">
        <div class="section-label">${t('redsInFrame')}</div>
        <div class="row">
          ${[6, 10, 15].map(r => `<button class="chip ${state.maxReds===r?'active':''}" onclick="setMaxReds(${r})">${r} Reds</button>`).join('')}
        </div>
      </div>

      <div class="row wrap">${teamCol('A', state.teamA, aMax)}${teamCol('B', state.teamB, bMax)}</div>
      <button class="btn" ${canStart?'':'disabled'} onclick="startFrame()">${state.lang==='he'?t('beginScoringRtl'):t('beginScoring')}</button>
    </div>`;
}

/* Scoring Engine & Sequence Validation */
function opposingTeam(playerId){
  if (state.teamA.includes(playerId)) return state.teamB;
  return state.teamA;
}
function selectStriker(id){
  if (id === state.currentStrikerId) return;
  state.currentStrikerId = id;
  const opposing = opposingTeam(id);
  if (!opposing.includes(state.currentOpponentReceiverId)) state.currentOpponentReceiverId = opposing[0];
  state.events.push({ type:'SWITCH_TURN', playerId:id, playerName: state.playerNames[id]||'', timestamp: Date.now() });
  state.validationWarning = null;
  render();
}
function selectReceiver(id){
  state.currentOpponentReceiverId = id;
  render();
}

function potBall(ballName){
  const ball = BALL_COLORS.find(b => b.name === ballName);
  state.validationWarning = null;

  // Count potted reds so far
  const redsPotted = state.events.filter(e => e.type === 'BALL' && e.ball === 'RED').length;

  if (ballName === 'RED') {
    if (redsPotted >= state.maxReds) {
      state.validationWarning = t('maxRedsExceeded');
    }
  } else {
    // If reds are still on table or break is active
    let lastEvent = null;
    for (let i = state.events.length - 1; i >= 0; i--) {
      if (state.events[i].type === 'BALL') { lastEvent = state.events[i]; break; }
      if (state.events[i].type === 'SWITCH_TURN' || state.events[i].type === 'FOUL') break;
    }
    
    // When clearing colors after all reds are potted:
    if (redsPotted >= state.maxReds) {
      const pottedColors = state.events.filter(e => e.type === 'BALL' && e.ball !== 'RED').map(e => e.ball);
      const nextExpectedColor = COLOR_SEQUENCE.find(c => !pottedColors.includes(c));
      if (nextExpectedColor && ballName !== nextExpectedColor) {
        state.validationWarning = t('colorOrderWarning');
      }
    } else if (lastEvent && lastEvent.ball !== 'RED' && lastEvent.playerId === state.currentStrikerId) {
      // Potting color after another color without a red in between
      state.validationWarning = t('invalidSequenceWarning');
    }
  }

  state.events.push({
    type:'BALL',
    playerId: state.currentStrikerId,
    playerName: state.playerNames[state.currentStrikerId]||'',
    ball: ball.name,
    points: ball.points,
    timestamp: Date.now()
  });
  render();
}

function recordFoul(value){
  state.validationWarning = null;
  const receiver = state.currentOpponentReceiverId;
  state.events.push({
    type:'FOUL',
    playerId: state.currentStrikerId,
    playerName: state.playerNames[state.currentStrikerId]||'',
    points: value,
    foulReceiverId: receiver,
    foulReceiverName: state.playerNames[receiver]||'',
    timestamp: Date.now()
  });
  render();
}

function potBlackBallDecider(){
  state.events.push({
    type:'BALL',
    playerId: state.currentStrikerId,
    playerName: state.playerNames[state.currentStrikerId]||'',
    ball:'BLACK',
    points:7,
    blackBallDecider:true,
    timestamp: Date.now()
  });
  state.decidedByBlackBall = true;
  render();
}
function recordBlackBallDeciderFoul(value){
  const receiver = state.currentOpponentReceiverId;
  state.events.push({
    type:'FOUL',
    playerId: state.currentStrikerId,
    playerName: state.playerNames[state.currentStrikerId]||'',
    points: value,
    foulReceiverId: receiver,
    foulReceiverName: state.playerNames[receiver]||'',
    blackBallDecider:true,
    timestamp: Date.now()
  });
  state.decidedByBlackBall = true;
  render();
}

function undoLast(){
  if (state.events.length) state.events.pop();
  state.validationWarning = null;
  render();
}
function requestFinish(){
  state.showSummary = true;
  render();
}
function dismissSummary(){
  state.showSummary = false;
  render();
}

function renderScoring(){
  const { scores } = computeFrameState(state.participantIds, state.events);
  const teamAScore = state.teamA.reduce((s,id) => s + (scores[id]||0), 0);
  const teamBScore = state.teamB.reduce((s,id) => s + (scores[id]||0), 0);

  const scorecards = state.participantIds.map(id => {
    const isA = state.teamA.includes(id);
    const isStriker = id === state.currentStrikerId;
    return `
      <div class="scorecard ${isStriker?'active':''}" onclick="selectStriker('${id}')">
        <div class="team">${isA?t('teamA'):t('teamB')}</div>
        <div class="name">${escapeHtml(state.playerNames[id]||'')}</div>
        <div class="score tabular">${scores[id]||0}</div>
      </div>`;
  }).join('');

  const balls = BALL_COLORS.map(b => `
    <button class="ball-btn" style="background:${b.hex};color:${b.text}" onclick="potBall('${b.name}')">${b.points}</button>
  `).join('');

  const foulButtons = [4,5,6,7].map(v => `<button class="foul-btn" onclick="recordFoul(${v})">Foul ${v}</button>`).join('');

  const logHtml = state.events.slice().reverse().map(e => {
    let text = '';
    if (e.type === 'BALL') text = `${e.playerName} potted ${e.ball[0]+e.ball.slice(1).toLowerCase()} (+${e.points})`;
    else if (e.type === 'FOUL') text = `${e.playerName} FOUL — ${e.foulReceiverName} +${e.points}`;
    else if (e.type === 'SWITCH_TURN') text = `▶ ${e.playerName} on strike`;
    if (e.blackBallDecider) text += ' 🎱 Black Ball Game';
    const tVal = new Date(e.timestamp);
    const time = tVal.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    return `<div class="log-entry"><span class="log-time">${time}</span>${text}</div>`;
  }).join('') || `<div class="log-entry" style="opacity:.6">${t('noActionsYet')}</div>`;

  return `
    <div class="topbar">
      <button class="icon-btn" onclick="go('setup')">${state.lang==='he'?t('backRtl'):t('back')}</button>
      <h1>${state.mode} (${state.maxReds} Reds)</h1>
      <button class="icon-btn" onclick="undoLast()">${t('undo')}</button>
    </div>
    <div class="content">
      <div class="table-surface">
        <div class="scorecards">${scorecards}</div>
        
        ${state.validationWarning ? `
          <div class="toast-warning">
            <span>⚠️ ${escapeHtml(state.validationWarning)}</span>
            <button class="btn small" style="width:auto;padding:4px 8px" onclick="undoLast()">${t('undo')}</button>
          </div>` : ''}

        <div class="section-label">${t('onStrike')}: ${escapeHtml(state.playerNames[state.currentStrikerId]||'')}</div>
        <div class="ball-row">${balls}</div>

        <div class="section-label">${t('foulBy')} ${escapeHtml(state.playerNames[state.currentStrikerId]||'')} → ${t('pointsTo')} ${escapeHtml(state.playerNames[state.currentOpponentReceiverId]||'')}</div>
        <div class="foul-row">${foulButtons}</div>

        ${opposingTeam(state.currentStrikerId).length > 1 ? `
          <div class="section-label">${t('receivingOpponent')}</div>
          <div class="row wrap">
            ${opposingTeam(state.currentStrikerId).map(id => `
              <span class="chip ${state.currentOpponentReceiverId===id?'active':''}" onclick="selectReceiver('${id}')">
                ${escapeHtml(state.playerNames[id]||'')}
              </span>`).join('')}
          </div>` : ''}

        <div class="log">${logHtml}</div>
        <div style="margin-top:14px">
          <button class="btn" onclick="requestFinish()">${t('finishFrame')}</button>
        </div>
      </div>
    </div>
    ${state.showSummary ? renderSummaryModal(teamAScore, teamBScore, scores) : ''}`;
}

function renderSummaryModal(teamAScore, teamBScore, scores){
  const isDraw = teamAScore === teamBScore;
  let winnerText = '';
  if (isDraw) winnerText = t('drawGame');
  else winnerText = `${t('winner')}: ${teamAScore > teamBScore ? t('teamA') : t('teamB')}`;

  const perPlayer = state.participantIds.map(id => `
    <div class="stat-line">
      <span>${escapeHtml(state.playerNames[id]||'')} (${state.teamA.includes(id)?'A':'B'})</span>
      <span class="tabular" style="font-weight:600">${scores[id]||0} pts</span>
    </div>`).join('');

  return `
    <div class="modal-backdrop" onclick="if(event.target===this && !${state.saving}) dismissSummary()">
      <div class="modal">
        <h2>${t('frameSummary')}</h2>
        <p style="font-weight:600;margin:8px 0 0">${winnerText}</p>
        <p class="tabular" style="font-size:1.1rem;margin:6px 0 16px">Team A: ${teamAScore} — Team B: ${teamBScore}</p>
        ${perPlayer}

        ${isDraw ? `
          <div class="card" style="background:#fff3cd;border-color:#ffe69c;color:#664d03;margin:14px 0">
            <strong>🎱 ${t('blackBallGameHeader')}</strong>
            <p style="font-size:.85rem;margin:4px 0 10px">${t('blackBallDeciderNotice')}</p>
            <div class="row wrap">
              ${state.participantIds.map(id => `
                <span class="chip ${state.currentStrikerId===id?'active':''}" onclick="selectStriker('${id}')">
                  ${escapeHtml(state.playerNames[id]||'')}
                </span>`).join('')}
            </div>
            <div style="text-align:center;margin:12px 0 6px">
              <button class="ball-btn" style="background:#212121;color:#fff;width:60px;height:60px;font-size:1.1rem" onclick="potBlackBallDecider()">${t('potBlack')}</button>
            </div>
            <div class="foul-row">
              ${[4,5,6,7].map(v => `<button class="foul-btn" onclick="recordBlackBallDeciderFoul(${v})">Foul ${v}</button>`).join('')}
            </div>
          </div>` : ''}

        ${state.saveError ? `<div class="error-box" style="margin-top:12px">${escapeHtml(state.saveError)}</div>` : ''}

        <div style="margin-top:16px;display:flex;flex-direction:column;gap:10px">
          <button class="btn" ${state.saving||state.summarySaved?'disabled':''} onclick="saveFrame()">${t('saveAndFinish')}</button>
          <button class="btn secondary" onclick="dismissSummary()">${t('dismiss')}</button>
        </div>
      </div>
    </div>`;
}

async function saveFrame(){
  state.saving = true; state.saveError = null; render();
  const { scores, highestBreaks, foulGiven, foulReceived } = computeFrameState(state.participantIds, state.events);
  const teamAScore = state.teamA.reduce((s,id) => s + (scores[id]||0), 0);
  const teamBScore = state.teamB.reduce((s,id) => s + (scores[id]||0), 0);

  let winnerTeam = 'DRAW';
  if (teamAScore > teamBScore) winnerTeam = 'A';
  else if (teamBScore > teamAScore) winnerTeam = 'B';

  const winnerPlayerIds = winnerTeam === 'A' ? state.teamA : (winnerTeam === 'B' ? state.teamB : []);

  const doc = {
    mode: state.mode,
    maxReds: state.maxReds,
    playerIds: state.participantIds,
    playerNames: state.playerNames,
    teamA: state.teamA,
    teamB: state.teamB,
    finalScores: scores,
    highestBreaks,
    foulPointsGiven: foulGiven,
    foulPointsReceived: foulReceived,
    teamAScore,
    teamBScore,
    winnerTeam,
    winnerPlayerIds,
    decidedByBlackBall: state.decidedByBlackBall,
    events: state.events,
    createdAt: Date.now()
  };

  try{
    await db.collection('frames').add(doc);
    state.summarySaved = true;
    state.saving = false;
    go('history');
  } catch(e){
    state.saveError = e.message;
    state.saving = false;
    render();
  }
}

/* Statistics */
async function loadStats(){
  state.statsLoading = true; state.statsError = null; render();
  try{
    const snap = await db.collection('players').orderBy('name').get();
    state.players = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    const fSnap = await db.collection('frames').get();
    state.summaries = fSnap.docs.map(d => ({ id:d.id, ...d.data() }));
  } catch(e){ state.statsError = e.message; }
  state.statsLoading = false; render();
}

function openPlayerDetail(id, name){
  state.selectedPlayerId = id;
  state.selectedPlayerName = name;
  loadPlayerFrames(id);
}

function renderStats(){
  const playerStats = state.players.map(p => {
    const pFrames = state.summaries.filter(f => (f.playerIds||[]).includes(p.id));
    const totalFrames = pFrames.length;
    const wins = pFrames.filter(f => (f.winnerPlayerIds||[]).includes(p.id)).length;
    const highestBreak = Math.max(0, ...pFrames.map(f => (f.highestBreaks||{})[p.id] || 0));
    const fg = pFrames.reduce((s,f) => s + ((f.foulPointsGiven||{})[p.id]||0), 0);
    const fr = pFrames.reduce((s,f) => s + ((f.foulPointsReceived||{})[p.id]||0), 0);

    return `
      <div class="card" style="cursor:pointer" onclick="openPlayerDetail('${p.id}', '${escapeHtml(p.name)}')">
        <h3>${escapeHtml(p.name)}</h3>
        <div style="font-size:.85rem;opacity:.7;margin-top:4px">Frames: ${totalFrames} · Wins: ${wins}</div>
        <div class="stat-line" style="margin-top:8px">
          <span>${t('highestBreak')}</span>
          <span class="tabular font-weight:600">${highestBreak}</span>
        </div>
        <div class="stat-line">
          <span>${t('totalFoulsGivenReceived')}</span>
          <span class="tabular font-weight:600">${fg} / ${fr}</span>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="topbar">
      <button class="icon-btn" onclick="go('home')">${state.lang==='he'?t('backRtl'):t('back')}</button>
      <h1>${t('playerStats')}</h1>
      ${renderLangButton()}
    </div>
    <div class="content stack">
      ${state.statsLoading ? `<div class="empty">...</div>` : (playerStats || `<div class="empty">No stats available.</div>`)}
    </div>`;
}

async function loadPlayerFrames(id){
  state.playerDetailLoading = true; render();
  try{
    const snap = await db.collection('frames').where('playerIds','array-contains', id).get();
    state.playerFrames = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b) => a.createdAt - b.createdAt);
  } catch(e){ state.statsError = e.message; }
  state.playerDetailLoading = false;
  go('playerDetail');
}

function openFrameDetail(id){
  state.selectedFrame = state.playerFrames.find(f => f.id === id) || state.frames.find(f => f.id === id);
  if (!state.selectedFrame){
    db.collection('frames').doc(id).get().then(doc => {
      if (doc.exists){
        state.selectedFrame = { id: doc.id, ...doc.data() };
        go('frameDetail');
      }
    });
  } else {
    go('frameDetail');
  }
}

function renderPlayerDetail(){
  const id = state.selectedPlayerId;
  const frames = state.playerFrames;
  const scores = frames.map(f => (f.finalScores||{})[id] || 0);
  const breaks = frames.map(f => (f.highestBreaks||{})[id] || 0);
  const foulsGivenSeries = frames.map(f => (f.foulPointsGiven||{})[id] || 0);
  const foulsReceivedSeries = frames.map(f => (f.foulPointsReceived||{})[id] || 0);

  let maxBreakFrame = null, maxScoreFrame = null, maxFgFrame = null, maxFrFrame = null;
  let highestBreak = 0, bestScore = 0, maxFg = 0, maxFr = 0;

  frames.forEach(f => {
    const b = (f.highestBreaks||{})[id]||0;
    const s = (f.finalScores||{})[id]||0;
    const fg = (f.foulPointsGiven||{})[id]||0;
    const fr = (f.foulPointsReceived||{})[id]||0;

    if (b >= highestBreak) { highestBreak = b; maxBreakFrame = f.id; }
    if (s >= bestScore) { bestScore = s; maxScoreFrame = f.id; }
    if (fg >= maxFg) { maxFg = fg; maxFgFrame = f.id; }
    if (fr >= maxFr) { maxFr = fr; maxFrFrame = f.id; }
  });

  return `
    <div class="topbar">
      <button class="icon-btn" onclick="go('stats')">${state.lang==='he'?t('backRtl'):t('back')}</button>
      <h1>${escapeHtml(state.selectedPlayerName||'Player')}</h1>
      ${renderLangButton()}
    </div>
    <div class="content stack">
      <div class="row wrap">
        <div class="metric-card" style="flex:1" onclick="${maxBreakFrame?`openFrameDetail('${maxBreakFrame}')`:''}">
          <div style="font-size:.75rem;opacity:.7">${t('highestBreak')}</div>
          <div style="font-size:1.5rem;font-weight:700" class="tabular">${highestBreak}</div>
        </div>
        <div class="metric-card" style="flex:1" onclick="${maxScoreFrame?`openFrameDetail('${maxScoreFrame}')`:''}">
          <div style="font-size:.75rem;opacity:.7">${t('bestFrameScore')}</div>
          <div style="font-size:1.5rem;font-weight:700" class="tabular">${bestScore}</div>
        </div>
      </div>

      <div class="row wrap">
        <div class="metric-card" style="flex:1" onclick="${maxFgFrame?`openFrameDetail('${maxFgFrame}')`:''}">
          <div style="font-size:.75rem;opacity:.7">${t('mostFoulsGivenInFrame')}</div>
          <div style="font-size:1.5rem;font-weight:700" class="tabular">${maxFg}</div>
        </div>
        <div class="metric-card" style="flex:1" onclick="${maxFrFrame?`openFrameDetail('${maxFrFrame}')`:''}">
          <div style="font-size:.75rem;opacity:.7">${t('mostFoulsReceivedInFrame')}</div>
          <div style="font-size:1.5rem;font-weight:700" class="tabular">${maxFr}</div>
        </div>
      </div>

      <div class="card stack">
        <h3>${t('scoreProgression')}</h3>
        <canvas id="scoreChart" class="chart"></canvas>
      </div>

      <div class="card stack">
        <h3>${t('breakProgression')}</h3>
        <canvas id="breakChart" class="chart"></canvas>
      </div>

      <div class="card stack">
        <h3>${t('foulsReceivedProgression')}</h3>
        <canvas id="foulsChart" class="chart"></canvas>
      </div>
    </div>`;
}

function attachCharts(){
  setTimeout(() => {
    const id = state.selectedPlayerId;
    const frames = state.playerFrames;
    const scores = frames.map(f => (f.finalScores||{})[id] || 0);
    const breaks = frames.map(f => (f.highestBreaks||{})[id] || 0);
    const foulsReceived = frames.map(f => (f.foulPointsReceived||{})[id] || 0);

    drawChart('scoreChart', scores, '#1F7A44');
    drawChart('breakChart', breaks, '#8B5E34');
    drawChart('foulsChart', foulsReceived, '#1976D2');
  }, 50);
}

function drawChart(canvasId, values, color){
  const cvs = document.getElementById(canvasId);
  if (!cvs) return;
  const ctx = cvs.getContext('2d');
  const rect = cvs.getBoundingClientRect();
  cvs.width = rect.width * window.devicePixelRatio;
  cvs.height = rect.height * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

  ctx.clearRect(0, 0, rect.width, rect.height);
  if (!values.length) return;

  const padX = 24, padTop = 24, padBottom = 20;
  const w = rect.width - padX*2, h = rect.height - padTop - padBottom;
  const maxV = Math.max(1, ...values), minV = Math.min(0, ...values);
  const range = Math.max(1, maxV - minV);
  const stepX = values.length > 1 ? w / (values.length - 1) : 0;
  const pt = i => [padX + stepX*i, padTop + h - ((values[i]-minV)/range)*h];

  ctx.strokeStyle = '#e6e0cc';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(padX, padTop+h); ctx.lineTo(padX+w, padTop+h);
  ctx.stroke();

  function drawLabels(){
    ctx.font = '600 10px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#1B1B1B';
    values.forEach((v,i) => {
      const [x,y] = pt(i);
      ctx.fillText(String(v), x, Math.max(12, y - 8));
    });
  }

  if (values.length === 1){
    const [x,y] = pt(0);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x,y,4,0,7); ctx.fill();
    drawLabels();
    return;
  }

  ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.beginPath();
  values.forEach((v,i)=>{ const [x,y]=pt(i); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.stroke();

  ctx.fillStyle = color;
  values.forEach((v,i)=>{ const [x,y]=pt(i); ctx.beginPath(); ctx.arc(x,y,3.5,0,7); ctx.fill(); });
  drawLabels();
}

/* History */
async function loadFrameHistory(){
  state.framesLoading = true; state.framesError = null; render();
  try{
    const snap = await db.collection('frames').orderBy('createdAt','desc').get();
    state.frames = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  } catch(e){ state.framesError = e.message; }
  state.framesLoading = false; render();
}

async function deleteFrame(id){
  state.deleting = true; render();
  try{
    await db.collection('frames').doc(id).delete();
    state.confirmDeleteId = null;
    await loadFrameHistory();
  } catch(e){ state.framesError = e.message; }
  state.deleting = false; render();
}

function renderHistory(){
  const list = state.frames.map(f => {
    const d = new Date(f.createdAt);
    const dateStr = d.toLocaleDateString([], {day:'2-digit',month:'short',year:'numeric'});
    const teamAName = f.teamA.map(id => f.playerNames[id]||'').join(' & ');
    const teamBName = f.teamB.map(id => f.playerNames[id]||'').join(' & ');
    const winner = (f.winnerTeam === 'A' ? teamAName : (f.winnerTeam === 'B' ? teamBName : 'Draw')) + (f.decidedByBlackBall ? ' 🎱' : '');

    return `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <div style="cursor:pointer;flex:1" onclick="openFrameDetail('${f.id}')">
            <div style="font-size:.75rem;opacity:.6">${dateStr} · ${f.mode} (${f.maxReds||15} Reds)</div>
            <div style="font-weight:600;margin-top:2px">${escapeHtml(teamAName)} <span class="tabular">${f.teamAScore}</span> — <span class="tabular">${f.teamBScore}</span> ${escapeHtml(teamBName)}</div>
            <div style="font-size:.8rem;opacity:.7;margin-top:2px">${t('winner')}: ${escapeHtml(winner)}</div>
          </div>
          <button class="btn small danger" onclick="event.stopPropagation();state.confirmDeleteId='${f.id}';render()">${t('deleteFrame')}</button>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="topbar">
      <button class="icon-btn" onclick="go('home')">${state.lang==='he'?t('backRtl'):t('back')}</button>
      <h1>${t('frameHistory')}</h1>
      ${renderLangButton()}
    </div>
    <div class="content stack">
      ${state.framesLoading ? `<div class="empty">...</div>` : (list || `<div class="empty">No frames recorded yet.</div>`)}
    </div>
    ${state.confirmDeleteId ? `
      <div class="modal-backdrop" onclick="state.confirmDeleteId=null;render()">
        <div class="modal">
          <h2>${t('confirmDelete')}</h2>
          <p style="margin:12px 0">${t('deleteFrame')}?</p>
          <div style="display:flex;gap:10px;margin-top:16px">
            <button class="btn danger" ${state.deleting?'disabled':''} onclick="deleteFrame('${state.confirmDeleteId}')">${t('deleteFrame')}</button>
            <button class="btn secondary" onclick="state.confirmDeleteId=null;render()">${t('dismiss')}</button>
          </div>
        </div>
      </div>` : ''}`;
}

function renderFrameDetail(){
  const f = state.selectedFrame;
  if (!f) return `<div class="content"><div class="empty">Frame not found.</div></div>`;

  const d = new Date(f.createdAt);
  const dateStr = d.toLocaleDateString([], {day:'2-digit',month:'short',year:'numeric'});
  const teamAName = f.teamA.map(id => f.playerNames[id]||'').join(' & ');
  const teamBName = f.teamB.map(id => f.playerNames[id]||'').join(' & ');
  const winner = (f.winnerTeam === 'A' ? teamAName : (f.winnerTeam === 'B' ? teamBName : 'Draw')) + (f.decidedByBlackBall ? ' 🎱' : '');

  const perPlayer = f.playerIds.map(id => `
    <div class="stat-line">
      <span>${escapeHtml(f.playerNames[id]||'')}</span>
      <span class="tabular font-weight:600">${(f.finalScores||{})[id]||0} pts</span>
    </div>`).join('');

  const logHtml = (f.events||[]).slice().reverse().map(e => {
    let text = '';
    if (e.type === 'BALL') text = `${e.playerName} potted ${e.ball[0]+e.ball.slice(1).toLowerCase()} (+${e.points})`;
    else if (e.type === 'FOUL') text = `${e.playerName} FOUL — ${e.foulReceiverName} +${e.points}`;
    else if (e.type === 'SWITCH_TURN') text = `▶ ${e.playerName} on strike`;
    if (e.blackBallDecider) text += ' 🎱 Black Ball Game';
    const tVal = new Date(e.timestamp);
    const time = tVal.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    return `<div class="log-entry" style="color:var(--ink)"><span class="log-time">${time}</span>${text}</div>`;
  }).join('') || `<div class="empty">No event log saved for this frame.</div>`;

  return `
    <div class="topbar">
      <button class="icon-btn" onclick="go('history')">${state.lang==='he'?t('backRtl'):t('back')}</button>
      <h1>Frame Detail</h1>
      ${renderLangButton()}
    </div>
    <div class="content stack">
      <div class="card">
        <div style="font-size:.8rem;opacity:.65">${dateStr} · ${f.mode} (${f.maxReds||15} Reds)</div>
        <h3 style="margin-top:6px;text-transform:none">${escapeHtml(teamAName)} ${f.teamAScore} — ${f.teamBScore} ${escapeHtml(teamBName)}</h3>
        <div style="font-weight:600;margin-top:4px">${t('winner')}: ${escapeHtml(winner)}</div>
      </div>
      <div class="card">
        <h3 style="text-transform:none;margin-bottom:8px">${t('perPlayer')}</h3>
        ${perPlayer}
      </div>
      <div class="section-label" style="color:var(--ink)">${t('fullActionLog')}</div>
      <div class="card" style="max-height:260px;overflow-y:auto">${logHtml}</div>
      <button class="btn danger" onclick="deleteFrame('${f.id}')">${t('deleteFrame')}</button>
    </div>`;
}

function escapeHtml(str) {
  return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* Initial render */
render();
</script>
